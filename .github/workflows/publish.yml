name: publish
# Uploads the package to PyPI (or TestPyPI) with trusted publishing; no API token is stored.
# Runs when a GitHub release whose tag is v<package version> is published, or by hand
# (Actions > publish > Run workflow, choosing testpypi or pypi). A release whose tag
# doesn't match the package version (a data-only release) is built but not uploaded.
# Nothing can be uploaded until the trusted publisher is set up on PyPI: see RELEASING.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: "Where to upload"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check the version against the release tag
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/agentg2p/__init__.py').read()).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "release" ] && [ "$TAG" != "v$version" ]; then
            echo "::notice::release $TAG does not match package version $version (data-only release?); not uploading"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    if: needs.build.outputs.publish == 'true' && (github.event_name == 'release' || inputs.repository == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/agentg2p/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/agentg2p/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
